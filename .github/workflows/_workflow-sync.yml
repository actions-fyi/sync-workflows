name: Sync
# A reusable workflow around this repository's action, for the actions-fyi org: it keeps a
# repository's copies of the workflows and workflow templates of actions-fyi/.github up to date.
# Its caller, workflow-sync.yml of actions-fyi/.github, is distributed to the org's repositories like
# the other callers there, and runs in each of them. It runs as part of the caller's run, in that
# repository's context: the caller's event and token.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# A repository pulls; nothing is pushed to it. The caller runs daily, on demand, and when
# _workflow-sync-dispatch.yml sends it a repository_dispatch event after a push to the source. That
# event only says "sync now": its payload is never read, and the source is always the default
# branch of actions-fyi/.github.
#
# What the workflows job does:
# - Checks out .github/workflows and workflow-templates of actions-fyi/.github, the source. The
#   sparse checkout is in cone mode, which also brings the files directly in .github, the egress
#   firewall's policy among them.
# - Runs this repository's action, which compares the repository's workflows with the source's
#   by file name. Only .yml and .yaml files are synced: a workflow only the repository has is
#   never touched, and actions.lock is never synced. A name in both source directories is taken
#   from .github/workflows. In a workflow template, $default-branch becomes the repository's
#   default branch.
# - Adds the workflows of the source's .github/workflows that the repository doesn't have yet:
#   everything there is meant for every repository of the org, so a new workflow reaches them
#   all without a pull request in each. A workflow template is only updated where a repository
#   already has a copy: it is for the repositories that picked it.
# - Syncs .github/egress-firewall.yaml, the egress firewall's policy, the same way, and adds it
#   where it is missing. The synced workflows run under that policy, so a workflow that needs a
#   new host and the policy that allows it arrive in the same pull request. The policy is
#   replaced as a whole: a host only one repository needs belongs in the source's policy.
# - Skips the names and paths in the repository's WORKFLOW_SYNC_EXCLUDE variable, separated by
#   commas or newlines. That is how a repository keeps a workflow out, or keeps its own policy.
# - Leaves a copy that differs from the source only in the versions it references, such as the
#   tag of a shared workflow it calls. Renovate updates those in every repository from the same
#   releases, so syncing them would open a second pull request for the same change. A copy that
#   differs in anything else is replaced by the source's, versions included.
# - Removes the workflows the source has retired, which RETIRED below lists, from a repository
#   that still has one, in the same pull request. Without that, a copy of a withdrawn workflow
#   would stay, and keep running, forever: nothing else ever deletes it.
# - When a copy differs, the action opens one pull request, or overwrites the branch of the one
#   that is still open. Nothing is pushed to the default branch, so the repository's own checks
#   run on the change, and its lockfile fix job updates actions.lock on the pull request.
# - Leaves an open pull request that already holds the changes alone, so its checks don't restart
#   and the lockfile fix stays, unless GitHub reports that it conflicts with the default branch,
#   e.g. because actions.lock changed there too. Then it is rebuilt from the default branch, and
#   the fix job runs again. With the force input, set from the caller's workflow_dispatch, it is
#   rebuilt in any case.
# - Turns on auto-merge, squash, for the sync pull request, so it merges itself once the checks
#   and reviews the repository's rulesets require pass, and a sync needs no one to merge it. The
#   org's squash merges use the pull request's title, the Conventional Commits one the action
#   sets. A repository that doesn't allow auto-merge, or requires nothing to wait for, gets a
#   warning instead, and its pull request is merged by hand as before. The token's pull requests
#   and contents write is what turning auto-merge on takes.
#
# The action runs with `uses: $/`, which resolves to this repository at the commit this workflow
# runs at, wherever it was called from. `./` would resolve to the caller's checkout instead.
#
# The pull request needs a token that can write contents, pull requests and workflow files, which
# the job's own token can't: it comes from Octo STS, identity workflow-sync, whose trust policy is
# .github/chainguard/workflow-sync.sts.yaml of actions-fyi/.github. The policy trusts this file by
# its job_workflow_ref, so the file must keep this name and path. Without that policy the job
# fails with an error that says so.
#
# It skips itself in actions-fyi/.github, the source, and in actions-fyi/shared-workflows, whose
# callers of the same file names call their siblings with `$/` and must not be replaced. For the
# same reason this repository's own workflow-sync.yml is excluded here.
#
# The calling job must grant what the workflows job declares, or the call fails before anything
# runs:
#   contents: read   # declared for the job; the source is public and read without credentials
#   id-token: write  # exchange the job's OIDC token with Octo STS
on:
  workflow_call:
    inputs:
      dry-run:
        description: >-
          Report which copies differ without pushing a branch or opening a pull request.
        type: boolean
        required: false
        default: false
      force:
        description: >-
          Rebuild the open sync pull request from the default branch even when it already holds
          the changes. The manual way to recreate it.
        type: boolean
        required: false
        default: false

permissions: {}

env:
  # Workflows that actions-fyi/.github used to offer and withdrew. Add a name here when a workflow
  # leaves the source; a name the source still has is kept, so the order of the two doesn't matter.
  # - workflow-sync-dispatch.yml: the dispatch is a job of workflow-sync.yml now. As a workflow of
  #   its own it was copied to every repository, where it can't get its token and fails.
  RETIRED: |
    workflow-sync-dispatch.yml

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Workflows
    if: >-
      github.repository != 'actions-fyi/.github'
      && github.repository != 'actions-fyi/shared-workflows'
    # Not ubuntu-24.04-firewall, the egress firewall's runner: its runner version is older than
    # 2.336.0 and refuses the `uses: $/` step below (github-early-access/actions-native-egress-
    # firewall#39).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run per repository at a time; a second one waits, so two never update the same pull
    # request at once.
    concurrency:
      group: workflow-sync-${{ github.repository }}
    permissions:
      contents: read # Declared for the job; the source is public
      id-token: write # Exchange the job's OIDC token with Octo STS
    steps:
      - name: Checkout Source
        id: source
        uses: actions/checkout@v7.0.1
        with:
          repository: actions-fyi/.github
          ref: main
          path: source
          sparse-checkout: |
            .github/workflows
            workflow-templates
          persist-credentials: false
      - name: Get Sync Token
        id: sts
        continue-on-error: true
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository_owner }}
          identity: workflow-sync
      - name: Report Missing Sync Token
        if: steps.sts.outcome != 'success'
        run: |
          echo "::error::Octo STS granted no token to sync the workflows. Check the trust policy .github/chainguard/workflow-sync.sts.yaml of actions-fyi/.github."
          exit 1
      # The default title starts with a Conventional Commits type, which the org's title check
      # requires.
      - name: Sync Workflows
        uses: $/
        with:
          source-repository: actions-fyi/.github
          source-path: source
          source-sha: ${{ steps.source.outputs.commit }}
          github-token: ${{ steps.sts.outputs.token }}
          exclude: ${{ format('{0},{1}', vars.WORKFLOW_SYNC_EXCLUDE, github.repository == 'actions-fyi/sync-workflows' && 'workflow-sync.yml' || '') }}
          remove: ${{ env.RETIRED }}
          files: .github/egress-firewall.yaml
          add: true
          ignore-versions: true
          dry-run: ${{ inputs.dry-run }}
          force: ${{ inputs.force }}
          auto-merge: squash
