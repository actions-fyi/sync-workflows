name: Sync Workflows
description: >-
  Keeps a repository's copies of the workflows and workflow templates of a source repository up to
  date, by opening one pull request and keeping it current.
author: actions-fyi
branding:
  icon: refresh-cw
  color: gray-dark
# A composite action with a single github-script step that loads plain CommonJS modules from
# src/: no npm dependencies, no build and no dist/. github-script's require resolves an absolute
# path as is, and github.action_path, which only composite actions have, is this action's own
# directory, wherever it was fetched to.
#
# It runs in the repository it updates. The workflow checks the source out first, and this reads
# .github/workflows and workflow-templates from that checkout. A workflow of the repository is
# updated when the source has a .yml or .yaml file of the same name; .github/workflows wins over
# workflow-templates. In a template, $default-branch becomes the repository's default branch.
# No other file, such as actions.lock, is touched, unless the files input names its path: that is
# how the egress firewall's policy follows the source too. Nothing is added unless the add input
# is set; then the repository also gets the workflows of the source's .github/workflows, and the
# files, that it lacks. A workflow is removed only when the remove input names it and the source
# no longer has it: that is how a workflow the source retired leaves the repositories that still
# have a copy.
#
# With auto-merge, the sync pull request also gets GitHub's auto-merge, so it merges itself once
# the default branch's required checks and reviews pass.
#
# Every input reaches the script through the step's env, never by interpolation into the script.
#
# Permissions github-token needs on the repository (none of them for a dry run, which only reads):
#   contents: write, pull requests: write, workflows: write
# The job's own GITHUB_TOKEN can't have the last one, so pass an app's token.
inputs:
  source-repository:
    description: The source repository, owner/name. It names the source in the commit and the pull request.
    required: true
  source-path:
    description: >-
      The directory of the source's checkout, relative to GITHUB_WORKSPACE. It holds the source's
      .github/workflows and workflow-templates.
    required: false
    default: "."
  source-sha:
    description: >-
      The source commit that was checked out, e.g. the commit output of actions/checkout. The
      commit and the pull request link to it. Empty links to the source's default branch.
    required: false
    default: ""
  github-token:
    description: The token that reads the repository, pushes the branch and opens the pull request.
    required: false
    default: ${{ github.token }}
  branch:
    description: >-
      The branch of the pull request. It belongs to this action: each sync that finds a
      difference rebuilds it from the default branch.
    required: false
    default: sync/workflows
  title:
    description: >-
      The commit's subject and the pull request's title. Empty means "ci: sync workflows from
      <source-repository>".
    required: false
    default: ""
  exclude:
    description: >-
      Workflow file names, and paths from files, that are never synced or added, separated by
      newlines or commas.
    required: false
    default: ""
  files:
    description: >-
      Paths of other files of the source to sync to the same path, separated by newlines or
      commas, e.g. .github/egress-firewall.yaml. Each is copied as it is and compared as a whole.
    required: false
    default: ""
  add:
    description: >-
      Also add what the repository lacks: every workflow in the source's .github/workflows, and
      every path in files. A workflow template is never added.
    required: false
    default: "false"
  remove:
    description: >-
      Workflow file names the source has retired, separated by newlines or commas. A repository
      that still has one loses it in the sync pull request. A name the source still has is kept.
    required: false
    default: ""
  ignore-versions:
    description: >-
      Leave a copy that differs from the source only in the versions it references, e.g. the ref of
      a `uses:`, as it is. For repositories where Renovate updates those versions.
    required: false
    default: "false"
  ignore-whitespace:
    description: >-
      Leave a copy that differs from the source only in whitespace as it is: the spacing inside a
      line, trailing whitespace and blank lines, but not indentation. For repositories that run a
      formatter, which would only respace the sync's changes back. Applies to files too.
    required: false
    default: "true"
  dry-run:
    description: Report which copies differ, but make no changes on GitHub.
    required: false
    default: "false"
  force:
    description: >-
      Rebuild the open pull request from the default branch even when it already holds the
      changes, dropping commits added to its branch. Without differences, it changes nothing.
    required: false
    default: "false"
  auto-merge:
    description: >-
      A merge method, merge, squash or rebase, to turn on GitHub's auto-merge with for the sync pull
      request, so it is merged once the default branch's rules are met. Empty leaves it off. The
      repository must allow auto-merge; when GitHub refuses, that is a warning.
    required: false
    default: ""
outputs:
  result:
    description: >-
      skipped, up-to-date, closed, created, updated, unchanged or dry-run; see src/main.js. Empty
      means the step failed.
    value: ${{ steps.sync.outputs.result }}
  changed:
    description: >-
      A JSON array of the workflow file names, and the paths from files, that differ from the
      source or are added.
    value: ${{ steps.sync.outputs.changed }}
  added:
    description: A JSON array of those in changed that the repository didn't have.
    value: ${{ steps.sync.outputs.added }}
  removed:
    description: A JSON array of the retired workflow file names the repository still has.
    value: ${{ steps.sync.outputs.removed }}
  pull-request-number:
    description: The number of the sync pull request, or empty when there is none.
    value: ${{ steps.sync.outputs.pull-request-number }}
  pull-request-url:
    description: The URL of the sync pull request, or empty when there is none.
    value: ${{ steps.sync.outputs.pull-request-url }}
  auto-merge:
    description: >-
      enabled when the sync pull request has auto-merge on, unavailable when GitHub refused to turn
      it on, or empty without auto-merge or a pull request.
    value: ${{ steps.sync.outputs.auto-merge }}
runs:
  using: composite
  steps:
    - name: Sync Workflows
      id: sync
      uses: actions/github-script@v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        SYNC_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        SYNC_SOURCE_PATH: ${{ inputs.source-path }}
        SYNC_SOURCE_SHA: ${{ inputs.source-sha }}
        SYNC_BRANCH: ${{ inputs.branch }}
        SYNC_TITLE: ${{ inputs.title }}
        SYNC_EXCLUDE: ${{ inputs.exclude }}
        SYNC_REMOVE: ${{ inputs.remove }}
        SYNC_FILES: ${{ inputs.files }}
        SYNC_ADD: ${{ inputs.add }}
        SYNC_IGNORE_VERSIONS: ${{ inputs.ignore-versions }}
        SYNC_IGNORE_WHITESPACE: ${{ inputs.ignore-whitespace }}
        SYNC_DRY_RUN: ${{ inputs.dry-run }}
        SYNC_FORCE: ${{ inputs.force }}
        SYNC_AUTO_MERGE: ${{ inputs.auto-merge }}
      with:
        github-token: ${{ inputs.github-token }}
        script: return await require(process.env.ACTION_PATH + '/src/main.js')({ github, context, core })
